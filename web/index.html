<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maestro</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; color: #1a1a1a; background: #fafafa; }
        header { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid #e0e0e0; background: #fff; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        .scan-controls { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
        .scan-indicator { font-size: 0.85rem; color: #666; }
        button { padding: 0.4rem 1rem; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
        button:hover:not(:disabled) { background: #f0f0f0; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        main { padding: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; }
        th { font-size: 0.75rem; text-transform: uppercase; color: #888; font-weight: 500; }
        td.num { font-variant-numeric: tabular-nums; text-align: right; }
        tr:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <header>
        <h1>Maestro</h1>
        <div class="scan-controls">
            <span id="scan-indicator" class="scan-indicator"></span>
            <button id="rescan-btn">Rescan</button>
        </div>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Album</th>
                    <th style="text-align:right">Duration</th>
                </tr>
            </thead>
            <tbody id="track-list"></tbody>
        </table>
    </main>
    <script src="app.js"></script>
</body>
</html>
